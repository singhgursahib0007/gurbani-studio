<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gurbani Studio</title>
<meta name="description" content="Read and search Gurbani on the desktop.">
<link rel="icon" href="icons/favicon.ico" sizes="any">

<link rel="stylesheet" href="css/reader.css">
<script>
  /* Theme and pane geometry before first paint, so the window never flashes
     white or snaps from default widths to the saved ones. */
  try {
    var p = JSON.parse(localStorage.getItem("gurbani.studio.v1") || "{}");
    var t = p.theme && p.theme !== "auto" ? p.theme
      : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
    var r = document.documentElement.style;
    if (p.sidebarWidth) r.setProperty("--sidebar-w", p.sidebarWidth + "px");
    if (p.listWidth) r.setProperty("--list-w", p.listWidth + "px");
    if (p.measure) r.setProperty("--reader-measure", p.measure + "rem");
    if (p.textScale) r.setProperty("--reader-scale", p.textScale);
    if (p.gurFont) r.setProperty("--gur-font", '"' + p.gurFont + '"');
    if (p.gurWeight) r.setProperty("--gur-weight", p.gurWeight);
    var bar = {light:"#F2F4F8", sepia:"#F1E7D3", dark:"#0A1120", night:"#050505"}[t];
    var m = document.createElement("meta");
    m.name = "theme-color"; m.content = bar || "#F2F4F8";
    document.head.appendChild(m);
  } catch (e) {}
</script>
<style>
  #splash {
    position: fixed; inset: 0; z-index: 999;
    display: grid; place-items: center;
    background: #FFFFFF;
    transition: opacity 400ms cubic-bezier(0.32,0.72,0,1);
  }
  html[data-theme="sepia"] #splash { background: #FBF4E6; }
  html[data-theme="dark"]  #splash { background: #0C1524; }
  html[data-theme="night"] #splash { background: #000000; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash svg { width: 96px; height: 96px;
    animation: rise 600ms cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: scale(.9); } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #splash svg { animation: none; } }
</style>
<script>window.GURBANI_STATIC = {base: "data/"};</script>
